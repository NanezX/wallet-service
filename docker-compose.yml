# docker-compose.yml - solo para desarrollo local
# Uso: docker compose up --build

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet_service
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet_service"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: 3000
      DATABASE_URL: postgres://wallet:wallet@postgres:5432/wallet_service
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/v1/health || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3
    restart: unless-stopped

volumes:
  postgres-data:
